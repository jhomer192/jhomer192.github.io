<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <!-- A four-pointed star, the way a star is engraved on a chart: concave
         limbs, the vertical axis a little longer than the horizontal, so it
         reads as a point of light rather than a compass rose. Replaces a
         framework logo that shipped with the template. -->
    <path d="M64 2 Q67.5 60.5 118 64 Q67.5 67.5 64 126 Q60.5 67.5 10 64 Q60.5 60.5 64 2 Z"/>
    <style>
        path { fill: #14140f; }
        @media (prefers-color-scheme: dark) {
            path { fill: #faf7f0; }
        }
    </style>
</svg>
